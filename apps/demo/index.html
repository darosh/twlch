<html lang="en" class="dark">
  <head>
    <script>
      try {
        var t = localStorage.getItem("twlch-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.classList.toggle("dark", t === "dark");
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />

      content="twlch generates Tailwind-style 50–950 color scales from any color by interpolating Tailwind's hand-tuned OKLCH scales across the hue wheel."
    />

      name="keywords"
      content="tailwind, tailwind css, color scale, color palette, palette generator, oklch, interpolation, color shades, design tokens, css colors"
    />

    <meta name="author" content="Jan Forst" />
